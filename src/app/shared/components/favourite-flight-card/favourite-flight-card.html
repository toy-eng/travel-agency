<article class="grid grid-cols-[190px_minmax(0,1fr)] overflow-hidden rounded-[18px] border border-[rgba(17,34,17,0.08)] bg-white shadow-[0_12px_26px_rgba(17,34,17,0.06)] max-md:grid-cols-1">
  <div class="flex flex-col items-center justify-center gap-2 bg-[#fbfdfc] p-6 text-center">
    <span class="grid size-12 shrink-0 place-items-center rounded-full bg-[#fdecec] font-[Georgia] text-[1.35rem] font-bold text-[#e63146]" aria-hidden="true">
      {{ airlineInitial() }}
    </span>
    <h2 class="font-[Georgia] text-[1.1rem] text-[#e63146]">{{ airline() }}</h2>
    <span class="text-[0.75rem] text-[#52635c]">{{ flightCode() }}</span>
  </div>

  <div class="flex min-w-0 flex-col p-6">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div class="flex items-center gap-2 text-[#112211]">
        <span class="inline-grid min-h-[2rem] min-w-[2.2rem] place-items-center rounded-[8px] border border-[#dbeae5] bg-[#f2faf7] text-[0.9rem] font-bold">
          {{ rating().toFixed(1) }}
        </span>
        <strong class="text-[0.9rem] font-medium">Very Good</strong>
        <span class="text-[0.8rem] text-[#52635c]">{{ reviewCount() }} reviews</span>
      </div>

      <div class="shrink-0 text-right">
        <span class="block text-[0.8rem] text-[#52635c]">starting from</span>
        <strong class="mt-1 block font-display text-[1.75rem] font-extrabold leading-none text-[#ff706c]">{{ price() }}</strong>
      </div>
    </div>

    <div class="mt-5 flex items-center gap-4">
      <span class="flex flex-col">
        <strong class="text-[0.95rem] text-[#112211]">{{ departureTime() }}</strong>
        <small class="text-[0.72rem] text-[#52635c]">{{ departureLabel() }}</small>
      </span>

      <span class="flex flex-1 items-center gap-2 text-[0.78rem] text-[#52635c]">
        <span class="h-px flex-1 bg-[#dfe5e2]" aria-hidden="true"></span>
        <span class="whitespace-nowrap">{{ duration() }}</span>
        <span class="h-px flex-1 bg-[#dfe5e2]" aria-hidden="true"></span>
      </span>

      <span class="flex flex-col text-right">
        <strong class="text-[0.95rem] text-[#112211]">{{ arrivalTime() }}</strong>
        <small class="text-[0.72rem] text-[#52635c]">{{ arrivalLabel() }}</small>
      </span>
    </div>

    <p class="mt-3 text-[0.85rem] text-[#52635c]">{{ aircraft() }} • non stop</p>

    <div class="mt-5 flex items-center gap-3 border-t border-[rgba(17,34,17,0.08)] pt-4">
      <button
        type="button"
        class="flex h-[52px] w-[52px] shrink-0 items-center justify-center rounded-[10px] border border-[rgba(17,34,17,0.12)] bg-white text-[#112211] transition-colors hover:bg-[#f5f7f6]"
        aria-label="Remove from favourites"
        (click)="remove.emit()"
      >
        <svg class="size-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 0 1 6.5 4c1.74 0 3.41.81 4.5 2.09A6.07 6.07 0 0 1 15.5 4 4.5 4.5 0 0 1 20 8.5c0 3.78-3.4 6.86-8.55 11.5L12 21.35Z"/>
        </svg>
      </button>

      <a
        routerLink="/flights/flightdetails"
        class="flex h-[52px] flex-1 items-center justify-center rounded-[12px] bg-[#8DD3BB] text-[1.05rem] font-bold text-[#112211] transition-colors hover:bg-[#7ac7ae]"
      >
        View Deals
      </a>
    </div>
  </div>
</article>
