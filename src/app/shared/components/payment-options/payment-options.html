<section class="rounded-xl bg-white p-3 shadow-[0_8px_22px_rgba(17,34,17,0.06)] sm:p-4" aria-labelledby="payment-title">
  <h2 id="payment-title" class="sr-only">Payment options</h2>
  <div class="grid gap-1">
    <button type="button" class="flex w-full items-center justify-between rounded-lg px-3 py-3 text-left transition-colors" [class.bg-mint]="selectedOption() === 'full'" [attr.aria-pressed]="selectedOption() === 'full'" (click)="selectOption('full')">
      <span>
        <strong class="block text-sm text-[#112211]">Pay in full</strong>
        <small class="mt-1 block text-xs text-[#52635c]">Pay the total and you are all set</small>
      </span>
      <span class="grid size-4 shrink-0 place-items-center rounded-full border-2" [class.border-white]="selectedOption() === 'full'" [class.border-[#112211]]="selectedOption() !== 'full'" aria-hidden="true">
        <span class="size-2 rounded-full" [class.bg-white]="selectedOption() === 'full'" [class.opacity-0]="selectedOption() !== 'full'"></span>
      </span>
    </button>

    <button type="button" class="flex w-full items-center justify-between rounded-lg px-3 py-3 text-left transition-colors" [class.bg-mint]="selectedOption() === 'later'" [attr.aria-pressed]="selectedOption() === 'later'" (click)="selectOption('later')">
      <span>
        <strong class="block text-sm text-[#112211]">Pay part now, part later</strong>
        <small class="mt-1 block max-w-[520px] text-xs leading-5 text-[#52635c]">Pay $207.43 now, and the rest ($207.43) will be automatically charged to the same payment method on Nov 14, 2022. No extra fees.</small>
      </span>
      <span class="grid size-4 shrink-0 place-items-center rounded-full border-2" [class.border-white]="selectedOption() === 'later'" [class.border-[#112211]]="selectedOption() !== 'later'" aria-hidden="true">
        <span class="size-2 rounded-full" [class.bg-white]="selectedOption() === 'later'" [class.opacity-0]="selectedOption() !== 'later'"></span>
      </span>
    </button>
  </div>
  <button type="button" class="ml-3 mt-3 inline-block border-0 bg-transparent p-0 text-[0.68rem] text-[#112211] underline">More info</button>
</section>
