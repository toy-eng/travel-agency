@if (!isHomePage()) {
  <nav
    aria-label="Breadcrumb"
    class="mx-auto max-w-7xl px-4 pt-6 pb-2 sm:px-6 lg:px-8"
    [class.breadcrumbs--top-level]="isTopLevelRoute()"
  >
    <ol class="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs font-medium sm:text-sm">
      @for (item of items(); track item.url; let last = $last) {
        <li class="flex items-center">
          @if (last) {
            <span
              aria-current="page"
              class="relative inline-flex pb-1 text-xs font-semibold text-neutral-900 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-4 after:rounded-full after:bg-[#8DD3BB] after:content-[''] sm:text-sm"
            >
              {{ item.label }}
            </span>
          } @else {
            <a
              [routerLink]="item.url"
              class="group inline-flex items-center gap-1.5 px-0.5 py-1 text-neutral-500 transition hover:text-neutral-900"
            >
              @if (item.icon === 'home') {
                <svg
                  class="size-3.5 shrink-0"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m3 10.5 9-7.5 9 7.5V21H3V10.5Z"
                  />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 21v-6h6v6" />
                </svg>
              }
              <span
                class="underline-offset-4 group-hover:underline group-hover:decoration-[#8DD3BB] group-hover:decoration-2"
              >
                {{ item.label }}
              </span>
            </a>
          }
        </li>

        @if (!last) {
          <li class="text-neutral-400" aria-hidden="true">
            <svg
              class="size-3.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" />
            </svg>
          </li>
        }
      }
    </ol>
  </nav>
}
