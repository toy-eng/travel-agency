<aside class="rounded-xl bg-white p-4 text-[#112211] shadow-[0_8px_22px_rgba(17,34,17,0.06)] sm:p-5" aria-labelledby="summary-title">
  <div class="flex gap-4 border-b border-[#dfe5e2] pb-4">
    <img [src]="imageUrl()" [alt]="imageAlt()" class="size-[84px] shrink-0 rounded-lg object-cover" />
    <div class="min-w-0">
      <p class="text-xs text-[#52635c]">{{ subtitle() }}</p>
      <h2 id="summary-title" class="mt-1 text-base font-bold leading-snug">{{ title() }}</h2>
      <div class="mt-2 flex items-center gap-2 text-[0.68rem]">
        <span class="rounded border border-mint px-2 py-1">{{ rating().toFixed(1) }}</span>
        <strong>{{ ratingLabel() }}</strong>
        <span>{{ reviewCount() }} reviews</span>
      </div>
    </div>
  </div>

  <p class="border-b border-[#dfe5e2] py-3 text-xs">Your booking is protected by <strong>golobe</strong></p>

  <h3 class="pt-3 text-sm font-medium">Price Details</h3>
  <dl class="mt-2 grid gap-3 text-xs">
    @for (row of priceRows(); track row.label) {
      <div class="flex justify-between">
        <dt>{{ row.label }}</dt>
        <dd class="font-bold">{{ row.value }}</dd>
      </div>
    }
  </dl>

  <div class="mt-3 flex justify-between border-t border-[#dfe5e2] pt-3 text-xs">
    <span>Total</span>
    <strong>{{ total() }}</strong>
  </div>
</aside>
