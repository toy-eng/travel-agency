<!-- Small screens: the strip scrolls on its own so the chips never overflow the page -->
<nav #strip class="no-scrollbar relative flex gap-2 overflow-x-auto pb-1 lg:hidden" aria-label="Settings sections">
  @for (section of sections(); track section.id) {
    <button
      #chip
      type="button"
      class="chip"
      [class.chip--active]="activeId() === section.id"
      [attr.aria-current]="activeId() === section.id ? 'true' : null"
      (click)="select.emit(section.id)"
    >
      {{ section.label }}
    </button>
  }
</nav>

<!-- Large screens: sticky rail -->
<nav class="hidden lg:sticky lg:top-24 lg:block lg:self-start" aria-label="Settings sections">
  <p class="px-4 text-[0.7rem] font-semibold uppercase tracking-[0.14em] text-[#8b9a94]">On this page</p>

  <ul class="mt-3 space-y-1">
    @for (section of sections(); track section.id) {
      <li>
        <button
          type="button"
          class="rail"
          [class.rail--active]="activeId() === section.id"
          [attr.aria-current]="activeId() === section.id ? 'true' : null"
          (click)="select.emit(section.id)"
        >
          <span class="rail__icon" aria-hidden="true">
            @switch (section.icon) {
              @case ('bell') {
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-5v-5a7 7 0 0 0-5.5-6.83V4a1.5 1.5 0 0 0-3 0v1.17A7 7 0 0 0 5 12v5l-1.6 1.6V20h17.2v-1.4L19 17Z" />
                </svg>
              }
              @case ('compass') {
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm3.5 6.5-2.1 5.4-5.4 2.1 2.1-5.4 5.4-2.1Z" />
                </svg>
              }
              @case ('sliders') {
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z" />
                </svg>
              }
              @case ('shield') {
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4Zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8Z" />
                </svg>
              }
              @case ('help') {
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 17h-2v-2h2v2Zm2.07-7.75-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25Z" />
                </svg>
              }
            }
          </span>
          <span class="text-left">{{ section.label }}</span>
        </button>
      </li>
    }
  </ul>
</nav>
