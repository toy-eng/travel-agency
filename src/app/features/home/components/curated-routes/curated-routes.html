<section class="mx-auto max-w-7xl px-4 pb-16 pt-14 sm:px-6 sm:pb-20 sm:pt-20 lg:px-8">
  <div class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
    <div class="max-w-2xl">
      <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#4f8b75]"
        >Curated multi-stop routes</span
      >
      <h2
        class="mt-3 font-display text-3xl font-semibold leading-[1.04] tracking-[-0.04em] text-[#112211] sm:text-4xl lg:text-5xl"
      >
        Start with a route. Make it yours.
      </h2>
      <p class="mt-3 max-w-xl text-sm leading-relaxed text-[#5f6b64] sm:text-base">
        Thoughtful city combinations, already paced out. Pick one to load every leg into your
        journey builder.
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <span
        class="hidden items-center gap-2 rounded-full border border-[#dce7e1] bg-white px-4 py-2 text-xs font-semibold text-[#52635c] sm:flex"
      >
        <span class="size-2 rounded-full bg-[#8DD3BB]"></span>
        Tap any route to use it
      </span>
      <a
        routerLink="/explore"
        class="inline-flex items-center gap-2 rounded-full bg-[#112211] px-4 py-2 text-xs font-bold text-white transition hover:bg-[#1c2c18]"
      >
        See all routes
        <svg
          class="size-3.5 text-[#8DD3BB]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </a>
    </div>
  </div>

  <div class="grid gap-5 md:grid-cols-2 lg:grid-cols-3" data-reveal-group>
    @for (route of routes(); track route.id) {
      <button
        type="button"
        data-stagger-item
        (click)="routeSelected.emit(route)"
        class="group block overflow-hidden rounded-[24px] border border-[#dfe7e2] bg-white text-left shadow-[0_8px_30px_rgba(17,34,17,0.06)] transition duration-300 hover:-translate-y-1.5 hover:shadow-[0_18px_44px_rgba(17,34,17,0.13)] active:translate-y-0 active:scale-[0.995] cursor-pointer"
        [attr.aria-label]="'Use the ' + route.title + ' route'"
      >
        <div class="relative h-[290px] overflow-hidden bg-[#112211]">
          <img
            [src]="route.imageUrl"
            [alt]="route.title + ' travel route'"
            class="h-full w-full object-cover transition duration-700 ease-out group-hover:scale-[1.06]"
            loading="lazy"
          />
          <div
            class="absolute inset-0 bg-gradient-to-t from-[#07170d]/92 via-[#07170d]/15 to-transparent"
          ></div>

          <span
            class="absolute left-4 top-4 rounded-full border border-white/25 bg-white/15 px-3 py-1 text-[10px] font-bold uppercase tracking-[0.14em] text-white backdrop-blur-md"
          >
            {{ route.eyebrow }}
          </span>

          <div class="absolute inset-x-0 bottom-0 p-5 text-white">
            <h3
              class="font-display text-2xl font-semibold leading-tight tracking-[-0.025em] sm:text-[1.7rem]"
            >
              {{ route.title }}
            </h3>
            <p class="mt-1.5 text-sm leading-relaxed text-white/75">{{ route.description }}</p>
            <div
              class="mt-4 inline-flex items-center gap-2 rounded-full bg-white/12 px-3 py-1.5 text-[11px] font-semibold text-white/90 ring-1 ring-inset ring-white/20"
            >
              <svg
                class="size-3.5 text-[#8DD3BB]"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 12l4-4 4 4 4-4 6 6M3 18h18"
                />
              </svg>
              {{ route.routeLabel }}
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between gap-4 p-5">
          <div>
            <span
              class="block text-[11px] font-semibold uppercase tracking-[0.12em] text-[#7b8780]"
              >{{ route.durationLabel }}</span
            >
            <span class="mt-1 block text-base font-bold text-[#112211]">
              From {{ route.currency }} {{ route.price | number }}
              <span class="text-xs font-medium text-[#7b8780]">/ traveler</span>
            </span>
          </div>
          <span
            class="grid size-10 shrink-0 place-items-center rounded-full bg-[#eff7f3] text-[#2f6d57] transition duration-300 group-hover:bg-[#8DD3BB] group-hover:text-[#112211]"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </span>
        </div>
      </button>
    }
  </div>
</section>
