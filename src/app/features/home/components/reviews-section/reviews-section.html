<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 sm:py-20 lg:px-8">
  <div class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
    <div class="max-w-2xl">
      <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-[#4f8b75]"
        >Traveler reviews</span
      >
      <h2
        class="mt-3 font-display text-3xl font-semibold leading-[1.04] tracking-[-0.04em] text-[#112211] sm:text-4xl lg:text-5xl"
      >
        Loved by travelers who go further.
      </h2>
      <p class="mt-3 max-w-xl text-sm leading-relaxed text-[#5f6b64] sm:text-base">
        Real feedback from multi-stop trips planned, booked, and managed with Golobe.
      </p>
    </div>

    <div
      class="flex items-center gap-3 rounded-full border border-[#dce7e1] bg-white px-4 py-2 text-xs font-semibold text-[#52635c]"
    >
      <span class="flex -space-x-2" aria-hidden="true">
        @for (review of reviews(); track review.author) {
          <img
            [src]="review.imageUrl"
            [alt]="''"
            class="size-6 rounded-full border-2 border-white object-cover"
          />
        }
      </span>
      4.9 average on verified trips
    </div>
  </div>

  <div class="grid gap-6 lg:grid-cols-3" data-reveal-group>
    @for (review of reviews(); track review.author) {
      <app-review-card data-stagger-item [review]="review" />
    }
  </div>
</section>
