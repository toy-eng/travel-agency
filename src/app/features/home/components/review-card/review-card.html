<article
  class="group flex h-full min-h-[330px] flex-col rounded-[24px] border border-[#dfe7e2] bg-white p-6 shadow-[0_8px_30px_rgba(17,34,17,0.06)] transition duration-300 hover:-translate-y-1.5 hover:shadow-[0_18px_44px_rgba(17,34,17,0.12)]"
>
  <div class="flex items-start justify-between gap-4">
    <svg class="size-8 text-[#8DD3BB]" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
      <path
        d="M12.8 6.4C7.4 8.9 4.8 12.7 4.8 17.8c0 4.4 2.5 7.2 6.1 7.2 3.2 0 5.6-2.3 5.6-5.4 0-3-2-5.1-4.8-5.1-.6 0-1.1.1-1.8.3.5-2.4 2.1-4.4 4.9-6l-2-2.4zm14 0c-5.4 2.5-8 6.3-8 11.4 0 4.4 2.5 7.2 6.1 7.2 3.2 0 5.6-2.3 5.6-5.4 0-3-2-5.1-4.8-5.1-.6 0-1.1.1-1.8.3.5-2.4 2.1-4.4 4.9-6l-2-2.4z"
      />
    </svg>
    <div class="flex items-center gap-1">
      @for (star of stars; track star) {
        <svg
          class="size-4 text-[#ffce31]"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M12 2.8l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.4l6.2-.9L12 2.8z"
          />
        </svg>
      }
    </div>
  </div>

  <h3
    class="mt-5 font-display text-[1.55rem] font-semibold leading-[1.12] tracking-[-0.03em] text-[#112211]"
  >
    {{ review.quote }}
  </h3>
  <p class="mt-3 text-sm leading-relaxed text-[#5d6962]">{{ review.body }}</p>

  <div class="mt-auto flex items-center gap-3 border-t border-[#edf1ee] pt-5">
    <img
      [src]="review.imageUrl"
      [alt]="review.author"
      width="48"
      height="48"
      class="size-11 rounded-full object-cover ring-2 ring-[#e7f3ee]"
      loading="lazy"
    />
    <div class="min-w-0">
      <span class="block truncate text-sm font-bold text-[#112211]">{{ review.author }}</span>
      <span class="block truncate text-xs text-[#748079]">{{ review.role }}</span>
    </div>
    <span
      class="ml-auto hidden items-center gap-1 rounded-full bg-[#eff7f3] px-2.5 py-1 text-[10px] font-semibold text-[#3f7d68] sm:flex"
    >
      <svg
        class="size-3"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        aria-hidden="true"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
      {{ review.source }}
    </span>
  </div>
</article>
