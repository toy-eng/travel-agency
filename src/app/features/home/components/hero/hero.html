<section
  class="relative mx-auto max-w-7xl overflow-hidden rounded-t-none rounded-b-[30px] bg-[#0b2014] shadow-[0_24px_70px_rgba(17,34,17,0.18)] sm:rounded-b-[36px]"
>
  <img
    src="/homeHero.jpg"
    alt="Mountain lake surrounded by forest at sunrise"
    class="absolute inset-0 h-full w-full object-cover object-center"
  />
  <div
    class="absolute inset-0 bg-[linear-gradient(100deg,rgba(4,22,12,0.94)_0%,rgba(5,28,16,0.78)_38%,rgba(5,28,16,0.25)_70%,rgba(5,28,16,0.45)_100%)]"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-52 bg-gradient-to-b from-black/45 via-black/15 to-transparent"
    aria-hidden="true"
  ></div>
  <div
    class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-[#081b10]/90 via-[#081b10]/25 to-transparent"
    aria-hidden="true"
  ></div>
  <div
    class="absolute -right-24 top-24 size-64 rounded-full bg-[#8DD3BB]/15 blur-3xl"
    aria-hidden="true"
  ></div>

  <div
    class="relative z-10 px-6 pb-6 pt-28 text-white sm:px-8 sm:pb-8 sm:pt-36 lg:px-12 lg:pb-10 lg:pt-40"
  >
    <div class="max-w-[780px]">
      <span
        data-hero-eyebrow
        class="inline-flex items-center gap-2 rounded-full border border-white/20 bg-white/10 px-3.5 py-1.5 text-[10px] font-semibold uppercase tracking-[0.22em] text-white/85 backdrop-blur-md sm:text-[11px]"
      >
        <span class="size-1.5 rounded-full bg-[#8DD3BB]"></span>
        One trip, every stop
      </span>

      <h1
        data-hero-headline
        class="mt-5 max-w-[760px] font-display text-[2.9rem] font-semibold leading-[0.98] tracking-[-0.04em] text-white sm:text-6xl lg:text-[5.4rem]"
      >
        Design your dream
        <span class="text-[#8DD3BB]">multi-stop</span>
        journey.
      </h1>

      <p
        data-hero-subtext
        class="mt-5 max-w-[620px] text-base leading-relaxed text-white/80 sm:text-lg lg:text-xl"
      >
        Bundle multi-city flights, curated stays, and tourist experiences into one seamless
        itinerary.
      </p>

      <div
        data-hero-proof
        class="mt-7 flex flex-wrap items-center gap-x-6 gap-y-3 text-xs font-semibold text-white/75 sm:text-sm"
      >
        <span class="flex items-center gap-2">
          <svg
            class="size-4 text-[#8DD3BB]"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3 12l4-4 4 4 4-4 6 6M3 18h18"
            />
          </svg>
          180+ cities connected
        </span>
        <span class="hidden h-4 w-px bg-white/20 sm:block" aria-hidden="true"></span>
        <span class="flex items-center gap-2">
          <svg
            class="size-4 text-[#8DD3BB]"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          Flights + hotels + experiences
        </span>
      </div>
    </div>

    <div data-hero-builder class="relative mt-9 sm:mt-11 lg:mt-12">
      <ng-content />
    </div>
  </div>
</section>
