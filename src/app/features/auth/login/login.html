<app-auth-shell layout="equal">
  <span class="text-[10px] font-bold uppercase tracking-[0.18em] text-[#4f8b75]">
    Welcome back
  </span>
  <h1
    class="mt-3 font-display text-3xl font-semibold tracking-[-0.04em] text-[#112211] sm:text-4xl"
  >
    Login
  </h1>
  <p class="mt-2 text-sm leading-relaxed text-[#6d7972]">
    Sign in to pick up the trips, stays and saved ideas waiting for you.
  </p>

  <form (submit)="$event.preventDefault()" class="mt-7 space-y-5">
    <label class="block">
      <span class="mb-2 block text-xs font-bold text-[#112211]">Email</span>
      <input
        type="email"
        value="john.doe@gmail.com"
        placeholder="john.doe@gmail.com"
        class="h-12 w-full rounded-xl border border-[#dfe7e2] bg-[#fafcfb] px-4 text-sm font-medium text-[#112211] outline-none transition placeholder:text-[#9aa59e] hover:border-[#b9d9cc] focus:border-[#8DD3BB] focus:ring-2 focus:ring-[#8DD3BB]/25"
      />
    </label>

    <label class="block">
      <span class="mb-2 block text-xs font-bold text-[#112211]">Password</span>
      <span
        class="flex h-12 items-center rounded-xl border border-[#dfe7e2] bg-[#fafcfb] px-4 transition focus-within:border-[#8DD3BB] focus-within:ring-2 focus-within:ring-[#8DD3BB]/25 hover:border-[#b9d9cc]"
      >
        <input
          type="password"
          value="••••••••••••••••"
          placeholder="Enter password"
          class="w-full bg-transparent text-sm font-medium text-[#112211] outline-none placeholder:text-[#9aa59e]"
        />
        <button
          type="button"
          class="ml-2 grid size-8 shrink-0 place-items-center rounded-lg text-[#6d7972] transition hover:bg-[#eff7f3] hover:text-[#112211]"
          aria-label="Show password"
        >
          <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
            />
          </svg>
        </button>
      </span>
    </label>

    <div class="flex items-center justify-between gap-4 text-sm font-medium">
      <label class="flex cursor-pointer items-center gap-2 text-[#112211]">
        <input
          type="checkbox"
          checked
          class="size-4 rounded border-[#cfded7] accent-[#112211] focus:ring-[#8DD3BB]"
        />
        <span>Remember me</span>
      </label>
      <a routerLink="/forgot-password" class="font-bold text-[#2f6d57] hover:underline">
        Forgot password?
      </a>
    </div>

    <button
      type="submit"
      class="h-12 w-full cursor-pointer rounded-xl bg-[#8DD3BB] text-sm font-bold text-[#112211] shadow-[0_10px_24px_rgba(141,211,187,0.28)] transition hover:bg-[#74C0A3] active:scale-[0.99]"
    >
      Login
    </button>

    <p class="text-center text-sm font-medium text-[#112211]">
      Don't have an account?
      <a routerLink="/create-account" class="ml-1 font-bold text-[#2f6d57] hover:underline">
        Sign up
      </a>
    </p>

    <div class="relative my-7 flex items-center justify-center">
      <div class="w-full border-t border-[#edf1ee]"></div>
      <span class="absolute bg-white px-4 text-xs font-medium text-[#87938c]">Or login with</span>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <button
        type="button"
        class="flex h-12 cursor-pointer items-center justify-center rounded-xl border border-[#dfe7e2] bg-[#fbfdfc] transition hover:border-[#8DD3BB] hover:bg-[#eff7f3]"
        aria-label="Continue with Facebook"
      >
        <svg class="size-5" viewBox="0 0 256 256" aria-hidden="true">
          <path
            fill="#1877f2"
            d="M256 128C256 57.308 198.692 0 128 0S0 57.308 0 128c0 63.888 46.808 116.843 108 126.445V165H75.5v-37H108V99.8c0-32.08 19.11-49.8 48.348-49.8C170.352 50 185 52.5 185 52.5V84h-16.14C152.959 84 148 93.867 148 103.99V128h35.5l-5.675 37H148v89.445c61.192-9.602 108-62.556 108-126.445"
          />
          <path
            fill="#fff"
            d="m177.825 165l5.675-37H148v-24.01C148 93.866 152.959 84 168.86 84H185V52.5S170.352 50 156.347 50C127.11 50 108 67.72 108 99.8V128H75.5v37H108v89.445A129 129 0 0 0 128 256a129 129 0 0 0 20-1.555V165z"
          />
        </svg>
      </button>
      <button
        type="button"
        class="flex h-12 cursor-pointer items-center justify-center rounded-xl border border-[#dfe7e2] bg-[#fbfdfc] transition hover:border-[#8DD3BB] hover:bg-[#eff7f3]"
        aria-label="Continue with Google"
      >
        <svg class="size-5" viewBox="0 0 16 16" aria-hidden="true">
          <g fill="none" fill-rule="evenodd" clip-rule="evenodd">
            <path
              fill="#f44336"
              d="M7.209 1.061c.725-.081 1.154-.081 1.933 0a6.57 6.57 0 0 1 3.65 1.82a100 100 0 0 0-1.986 1.93q-1.876-1.59-4.188-.734q-1.696.78-2.362 2.528a78 78 0 0 1-2.148-1.658a.26.26 0 0 0-.16-.027q1.683-3.245 5.26-3.86"
              opacity=".987"
            />
            <path
              fill="#ffc107"
              d="M1.946 4.92q.085-.013.161.027a78 78 0 0 0 2.148 1.658A7.6 7.6 0 0 0 4.04 7.99q.037.678.215 1.331L2 11.116Q.527 8.038 1.946 4.92"
              opacity=".997"
            />
            <path
              fill="#448aff"
              d="M12.685 13.29a26 26 0 0 0-2.202-1.74q1.15-.812 1.396-2.228H8.122V6.713q3.25-.027 6.497.055q.616 3.345-1.423 6.032a7 7 0 0 1-.51.49"
              opacity=".999"
            />
            <path
              fill="#43a047"
              d="M4.255 9.322q1.23 3.057 4.51 2.854a3.94 3.94 0 0 0 1.718-.626q1.148.812 2.202 1.74a6.62 6.62 0 0 1-4.027 1.684a6.4 6.4 0 0 1-1.02 0Q3.82 14.524 2 11.116z"
              opacity=".993"
            />
          </g>
        </svg>
      </button>
      <button
        type="button"
        class="flex h-12 cursor-pointer items-center justify-center rounded-xl border border-[#dfe7e2] bg-[#fbfdfc] transition hover:border-[#8DD3BB] hover:bg-[#eff7f3]"
        aria-label="Continue with Apple"
      >
        <svg class="size-5 fill-current text-[#112211]" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M17.05 20.28c-.98.95-2.05.8-3.08.35c-1.09-.46-2.09-.48-3.24 0c-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8c1.18-.24 2.31-.93 3.57-.84c1.51.12 2.65.72 3.4 1.8c-3.12 1.87-2.38 5.98.48 7.13c-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25c.29 2.58-2.34 4.5-3.74 4.25"
          />
        </svg>
      </button>
    </div>
  </form>
</app-auth-shell>
