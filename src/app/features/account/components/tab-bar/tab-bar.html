<div class="no-scrollbar overflow-x-auto">
  <div
    class="relative flex w-max min-w-full overflow-hidden rounded-[14px] bg-white shadow-[0_8px_22px_rgba(17,34,17,0.06)]"
    role="tablist"
    [attr.aria-label]="ariaLabel()"
    (keydown)="onKeydown($event)"
  >
    <span
      class="pointer-events-none absolute bottom-0 h-[3px] rounded-full bg-mint transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]"
      [style.left.px]="indicatorLeft()"
      [style.width.px]="indicatorWidth()"
      aria-hidden="true"
    ></span>

    @for (tab of tabs(); track tab.id) {
      <button
        #tabButton
        type="button"
        [id]="idPrefix() + '-tab-' + tab.id"
        role="tab"
        class="flex flex-1 basis-0 items-center gap-2 whitespace-nowrap px-5 py-5 text-left transition-colors sm:px-6"
        [attr.aria-selected]="activeTab() === tab.id"
        [attr.tabindex]="activeTab() === tab.id ? 0 : -1"
        [attr.aria-controls]="idPrefix() + '-panel-' + tab.id"
        (click)="tabChange.emit(tab.id)"
      >
        @switch (tab.icon) {
          @case ('plane') {
            <svg class="size-5 shrink-0 text-[#112211]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5Z" />
            </svg>
          }
          @case ('bed') {
            <svg class="size-5 shrink-0 text-[#112211]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M7 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm12-6h-8v8H3V5H1v15h2v-3h18v3h2v-9a4 4 0 0 0-4-4Z" />
            </svg>
          }
        }
        <strong class="block whitespace-nowrap text-[0.95rem] font-semibold text-[#112211]">{{ tab.label }}</strong>
      </button>
    }
  </div>
</div>
