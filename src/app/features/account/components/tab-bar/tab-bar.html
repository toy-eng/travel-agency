<div class="no-scrollbar overflow-x-auto">
  <div
    class="flex w-max min-w-full gap-1 rounded-2xl border border-[#dfe7e2] bg-white p-1.5 shadow-[0_8px_26px_rgba(17,34,17,0.05)]"
    role="tablist"
    [attr.aria-label]="ariaLabel()"
    (keydown)="onKeydown($event)"
  >
    @for (tab of tabs(); track tab.id) {
      <button
        type="button"
        [id]="idPrefix() + '-tab-' + tab.id"
        role="tab"
        class="flex flex-1 basis-0 items-center justify-center gap-2 whitespace-nowrap rounded-xl px-4 py-3 text-sm font-bold transition active:scale-[0.98] cursor-pointer sm:px-5"
        [class]="
          activeTab() === tab.id
            ? 'bg-[#112211] text-white shadow-sm'
            : 'text-[#52635c] hover:bg-[#f2f7f4] hover:text-[#112211]'
        "
        [attr.aria-selected]="activeTab() === tab.id"
        [attr.tabindex]="activeTab() === tab.id ? 0 : -1"
        [attr.aria-controls]="idPrefix() + '-panel-' + tab.id"
        (click)="tabChange.emit(tab.id)"
      >
        @switch (tab.icon) {
          @case ('plane') {
            <svg
              class="size-4 shrink-0 text-[#8DD3BB]"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5Z"
              />
            </svg>
          }
          @case ('bed') {
            <svg
              class="size-4 shrink-0 text-[#8DD3BB]"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M7 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm12-6h-8v8H3V5H1v15h2v-3h18v3h2v-9a4 4 0 0 0-4-4Z"
              />
            </svg>
          }
        }
        <span>{{ tab.label }}</span>
      </button>
    }
  </div>
</div>
