<article class="flex flex-wrap items-center justify-between gap-6 py-5">
  <div class="flex min-w-0 flex-wrap items-center gap-6 lg:gap-10">
    <!-- Airline logo -->
    <span class="grid h-[70px] w-[92px] shrink-0 place-items-center rounded-[10px] border border-[rgba(17,34,17,0.1)] bg-white">
      <span class="flex flex-col items-center leading-none text-[#e63146]">
        <svg class="h-3 w-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 12" fill="currentColor" aria-hidden="true">
          <path d="M0 10c6-1 8-6 13-6s5 5 9 4 6-5 10-6c-5 1-7 7-12 8S10 5 5 8L0 10Z" />
        </svg>
        <span class="mt-1 font-[Georgia] text-[0.95rem] font-bold tracking-tight">{{ ticket().airline }}</span>
      </span>
    </span>

    <!-- Route -->
    <div class="flex items-center gap-4">
      <div>
        <p class="text-[0.75rem] text-[#52635c]">{{ ticket().departureLabel }}</p>
        <p class="mt-0.5 text-[0.95rem] font-bold text-[#112211]">{{ ticket().departureTime }}</p>
      </div>
      <span class="mt-3 h-px w-6 shrink-0 bg-[#112211]" aria-hidden="true"></span>
      <div>
        <p class="text-[0.75rem] text-[#52635c]">{{ ticket().arrivalLabel }}</p>
        <p class="mt-0.5 text-[0.95rem] font-bold text-[#112211]">{{ ticket().arrivalTime }}</p>
      </div>
    </div>

    <!-- Flight meta -->
    <dl class="flex items-start gap-6 lg:gap-10">
      <div class="grid gap-3">
        <div class="flex items-start gap-2.5">
          <span class="grid size-6 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68]" aria-hidden="true">
            <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm0 16H5V8h14v11Z" />
            </svg>
          </span>
          <div>
            <dt class="text-[0.7rem] text-[#52635c]">Date</dt>
            <dd class="font-semibold text-[#112211]">{{ ticket().date }}</dd>
          </div>
        </div>

        <div class="flex items-start gap-2.5">
          <span class="grid size-6 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68]" aria-hidden="true">
            <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 5h-2v6l5 3 1-1.7-4-2.3V7Z" />
            </svg>
          </span>
          <div>
            <dt class="text-[0.7rem] text-[#52635c]">Flight time</dt>
            <dd class="font-semibold text-[#112211]">{{ ticket().flightTime }}</dd>
          </div>
        </div>
      </div>

      <div class="grid gap-3">
        <div class="flex items-start gap-2.5">
          <span class="grid size-6 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68]" aria-hidden="true">
            <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16h-4v-4H8v4H4Zm3-11h2V8H7v2Zm4 0h2V8h-2v2Zm-4 4h2v-2H7v2Zm4 0h2v-2h-2v2Z" />
            </svg>
          </span>
          <div>
            <dt class="text-[0.7rem] text-[#52635c]">Gate</dt>
            <dd class="font-semibold text-[#112211]">{{ ticket().gate }}</dd>
          </div>
        </div>

        <div class="flex items-start gap-2.5">
          <span class="grid size-6 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68]" aria-hidden="true">
            <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M4 18v-4a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v4h-2v-2H6v2H4Zm4-6a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z" />
            </svg>
          </span>
          <div>
            <dt class="text-[0.7rem] text-[#52635c]">Seat no.</dt>
            <dd class="font-semibold text-[#112211]">{{ ticket().seat }}</dd>
          </div>
        </div>
      </div>
    </dl>
  </div>

  <div class="flex shrink-0 items-center gap-3">
    <button
      type="button"
      class="inline-flex h-11 items-center gap-2 rounded-[8px] bg-mint px-5 text-[0.85rem] font-bold text-[#112211] transition-all duration-200 hover:-translate-y-0.5 hover:bg-mint-dark hover:shadow-[0_4px_12px_rgba(0,0,0,0.15)]"
      [attr.aria-label]="'Download ticket for ' + ticket().airline + ' ' + ticket().departureTime"
      (click)="download.emit()"
    >
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.877a2 2 0 0 0 1.94-1.515L22 17" />
      </svg>
      Download Ticket
    </button>

    <button
      type="button"
      class="grid size-11 place-items-center rounded-[8px] border border-[rgba(17,34,17,0.14)] bg-white text-[#112211] transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#f5f7f6] hover:shadow-[0_4px_12px_rgba(0,0,0,0.15)]"
      aria-label="View ticket details"
      (click)="open.emit()"
    >
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6l6 6-6 6" />
      </svg>
    </button>
  </div>
</article>
