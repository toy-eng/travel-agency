<article class="flex flex-col gap-5 py-5 lg:flex-row lg:flex-nowrap lg:items-center lg:justify-between lg:gap-6">
  <div class="flex flex-wrap items-center gap-4 lg:gap-6 xl:gap-10">
    <!-- Airline logo -->
    <span class="grid h-[70px] w-[92px] shrink-0 place-items-center rounded-[10px] border border-[rgba(17,34,17,0.1)] bg-white">
      <span class="flex flex-col items-center leading-none text-[#e63146]">
        <svg class="h-3 w-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 12" fill="currentColor" aria-hidden="true">
          <path d="M0 10c6-1 8-6 13-6s5 5 9 4 6-5 10-6c-5 1-7 7-12 8S10 5 5 8L0 10Z" />
        </svg>
        <span class="mt-1 font-[Georgia] text-[0.95rem] font-bold tracking-tight">{{ ticket().airline }}</span>
      </span>
    </span>

    <!-- Route: departure/arrival share the remaining width on small screens -->
    <div class="flex min-w-0 flex-1 items-center gap-3 sm:gap-5 lg:flex-none lg:gap-4">
      <div>
        <p class="text-[0.75rem] text-[#52635c]">{{ ticket().departureLabel }}</p>
        <p class="mt-0.5 text-[0.95rem] font-bold text-[#112211]">{{ ticket().departureTime }}</p>
      </div>
      <span class="h-px flex-1 bg-[#112211] lg:mt-3 lg:w-6 lg:flex-none" aria-hidden="true"></span>
      <div>
        <p class="text-[0.75rem] text-[#52635c]">{{ ticket().arrivalLabel }}</p>
        <p class="mt-0.5 text-[0.95rem] font-bold text-[#112211]">{{ ticket().arrivalTime }}</p>
      </div>
    </div>

    <!-- Flight meta: 2 x 2 on small screens, two stacked columns from lg -->
    <dl class="grid w-full grid-cols-2 gap-x-2 gap-y-3 sm:gap-x-6 lg:w-auto lg:grid-cols-2 lg:gap-x-10 lg:gap-y-3">
      <div class="flex min-w-0 items-start gap-1.5 sm:gap-2.5 lg:col-start-1 lg:row-start-1">
        <span class="grid size-5 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68] lg:size-6" aria-hidden="true">
          <svg class="size-3 lg:size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm0 16H5V8h14v11Z" />
          </svg>
        </span>
        <div class="min-w-0">
          <dt class="text-[0.62rem] text-[#52635c] sm:text-[0.7rem]">Date</dt>
          <dd class="text-[0.85rem] font-semibold text-[#112211] sm:text-base">{{ ticket().date }}</dd>
        </div>
      </div>

      <div class="flex min-w-0 items-start gap-1.5 sm:gap-2.5 lg:col-start-1 lg:row-start-2">
        <span class="grid size-5 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68] lg:size-6" aria-hidden="true">
          <svg class="size-3 lg:size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 5h-2v6l5 3 1-1.7-4-2.3V7Z" />
          </svg>
        </span>
        <div class="min-w-0">
          <dt class="text-[0.62rem] text-[#52635c] sm:text-[0.7rem]">Flight time</dt>
          <dd class="text-[0.85rem] font-semibold text-[#112211] sm:text-base">{{ ticket().flightTime }}</dd>
        </div>
      </div>

      <div class="flex min-w-0 items-start gap-1.5 sm:gap-2.5 lg:col-start-2 lg:row-start-1">
        <span class="grid size-5 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68] lg:size-6" aria-hidden="true">
          <svg class="size-3 lg:size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16h-4v-4H8v4H4Zm3-11h2V8H7v2Zm4 0h2V8h-2v2Zm-4 4h2v-2H7v2Zm4 0h2v-2h-2v2Z" />
          </svg>
        </span>
        <div class="min-w-0">
          <dt class="text-[0.62rem] text-[#52635c] sm:text-[0.7rem]">Gate</dt>
          <dd class="text-[0.85rem] font-semibold text-[#112211] sm:text-base">{{ ticket().gate }}</dd>
        </div>
      </div>

      <div class="flex min-w-0 items-start gap-1.5 sm:gap-2.5 lg:col-start-2 lg:row-start-2">
        <span class="grid size-5 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68] lg:size-6" aria-hidden="true">
          <svg class="size-3 lg:size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 18v-4a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v4h-2v-2H6v2H4Zm4-6a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z" />
          </svg>
        </span>
        <div class="min-w-0">
          <dt class="text-[0.62rem] text-[#52635c] sm:text-[0.7rem]">Seat no.</dt>
          <dd class="text-[0.85rem] font-semibold text-[#112211] sm:text-base">{{ ticket().seat }}</dd>
        </div>
      </div>
    </dl>
  </div>

  <div class="flex items-center gap-3 lg:shrink-0">
    <button
      type="button"
      class="inline-flex h-11 flex-1 items-center justify-center gap-2 rounded-[8px] bg-mint px-5 text-[0.85rem] font-bold text-[#112211] transition-all duration-200 hover:-translate-y-0.5 hover:bg-mint-dark hover:shadow-[0_4px_12px_rgba(0,0,0,0.15)] lg:flex-none"
      [attr.aria-label]="'Download ticket for ' + ticket().airline + ' ' + ticket().departureTime"
      (click)="download.emit()"
    >
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.877a2 2 0 0 0 1.94-1.515L22 17" />
      </svg>
      Download Ticket
    </button>

    <button
      type="button"
      class="grid size-11 shrink-0 place-items-center rounded-[8px] border border-[rgba(17,34,17,0.14)] bg-white text-[#112211] transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#f5f7f6] hover:shadow-[0_4px_12px_rgba(0,0,0,0.15)]"
      aria-label="View ticket details"
      (click)="open.emit()"
    >
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6l6 6-6 6" />
      </svg>
    </button>
  </div>
</article>
