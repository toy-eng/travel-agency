<article class="flex flex-col gap-5 py-5 lg:flex-row lg:flex-nowrap lg:items-center lg:justify-between lg:gap-6">
  <div class="flex flex-wrap items-center gap-4 lg:gap-6 xl:gap-10">
    <!-- Hotel logo -->
    <span class="grid h-[70px] w-[92px] shrink-0 place-items-center rounded-[10px] border border-[rgba(17,34,17,0.1)] bg-white" aria-hidden="true">
      <span class="flex w-[70px] flex-col items-center text-center leading-none text-[#8b9a94]">
        <span class="font-display text-[0.85rem] font-extrabold tracking-[0.06em]">CVK</span>
        <span class="mt-[2px] w-full border-y border-[rgba(139,154,148,0.5)] py-[1px] text-[0.28rem] font-semibold uppercase tracking-[0.06em]">Park Bosphorus Hotel</span>
        <span class="mt-[2px] text-[0.24rem] uppercase tracking-[0.2em]">Istanbul</span>
      </span>
    </span>

    <!-- Check-in / Check-out dates: share the remaining width on small screens -->
    <div class="flex min-w-0 flex-1 items-center gap-3 sm:gap-5 lg:flex-none lg:gap-4">
      <div>
        <p class="text-[0.75rem] text-[#52635c]">Check-In</p>
        <p class="mt-0.5 text-[0.95rem] font-bold text-[#112211]">{{ ticket().checkInDate }}</p>
      </div>
      <span class="h-px flex-1 bg-[#112211] lg:mt-3 lg:w-6 lg:flex-none" aria-hidden="true"></span>
      <div>
        <p class="text-[0.75rem] text-[#52635c]">Check-Out</p>
        <p class="mt-0.5 text-[0.95rem] font-bold text-[#112211]">{{ ticket().checkOutDate }}</p>
      </div>
    </div>

    <!-- Stay meta: three across on small screens, stacked columns from lg -->
    <dl class="grid w-full grid-flow-col auto-cols-auto justify-between gap-x-2 gap-y-3 lg:w-auto lg:grid-flow-row lg:grid-cols-2 lg:justify-normal lg:gap-x-10 lg:gap-y-3">
      <div class="flex min-w-0 items-start gap-1 lg:gap-2.5 lg:col-start-1 lg:row-start-1">
        <span class="grid size-5 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68] lg:size-6" aria-hidden="true">
          <svg class="size-3 lg:size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 5h-2v6l5 3 1-1.7-4-2.3V7Z" />
          </svg>
        </span>
        <div class="min-w-0">
          <dt class="text-[0.62rem] text-[#52635c] lg:text-[0.7rem]">Check-in time</dt>
          <dd class="text-[0.85rem] font-semibold text-[#112211] lg:text-base">{{ ticket().checkInTime }}</dd>
        </div>
      </div>

      <div class="flex min-w-0 items-start gap-1 lg:gap-2.5 lg:col-start-1 lg:row-start-2">
        <span class="grid size-5 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68] lg:size-6" aria-hidden="true">
          <svg class="size-3 lg:size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 5h-2v6l5 3 1-1.7-4-2.3V7Z" />
          </svg>
        </span>
        <div class="min-w-0">
          <dt class="text-[0.62rem] text-[#52635c] lg:text-[0.7rem]">Check-out time</dt>
          <dd class="text-[0.85rem] font-semibold text-[#112211] lg:text-base">{{ ticket().checkOutTime }}</dd>
        </div>
      </div>

      <div class="flex min-w-0 items-start gap-1 lg:gap-2.5 lg:col-start-2 lg:row-start-1">
        <span class="grid size-5 shrink-0 place-items-center rounded bg-[#eaf6f2] text-[#3f7d68] lg:size-6" aria-hidden="true">
          <svg class="size-3 lg:size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm12-6h-8v8H3V5H1v15h2v-3h18v3h2v-9a4 4 0 0 0-4-4Z" />
          </svg>
        </span>
        <div class="min-w-0">
          <dt class="text-[0.62rem] text-[#52635c] lg:text-[0.7rem]">Room no.</dt>
          <dd class="text-[0.85rem] font-semibold text-[#112211] lg:text-base">{{ ticket().roomNumber }}</dd>
        </div>
      </div>
    </dl>
  </div>

  <div class="flex items-center gap-3 lg:shrink-0">
    <button
      type="button"
      class="inline-flex h-11 flex-1 items-center justify-center gap-2 rounded-[8px] bg-mint px-5 text-[0.85rem] font-bold text-[#112211] transition-all duration-200 hover:-translate-y-0.5 hover:bg-mint-dark hover:shadow-[0_4px_12px_rgba(0,0,0,0.15)] lg:flex-none"
      [attr.aria-label]="'Download ticket for stay ' + ticket().checkInDate"
      (click)="download.emit()"
    >
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.877a2 2 0 0 0 1.94-1.515L22 17" />
      </svg>
      Download Ticket
    </button>

    <button
      type="button"
      class="grid size-11 shrink-0 place-items-center rounded-[8px] border border-[rgba(17,34,17,0.14)] bg-white text-[#112211] transition-all duration-200 hover:-translate-y-0.5 hover:bg-[#f5f7f6] hover:shadow-[0_4px_12px_rgba(0,0,0,0.15)]"
      aria-label="View ticket details"
      (click)="open.emit()"
    >
      <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6l6 6-6 6" />
      </svg>
    </button>
  </div>
</article>
