<section
  role="tabpanel"
  id="account-panel-payment-methods"
  aria-labelledby="account-tab-payment-methods"
  class="rounded-[24px] border border-[#dfe7e2] bg-white p-5 shadow-[0_10px_34px_rgba(17,34,17,0.05)] sm:p-7"
>
  <div
    class="flex flex-col justify-between gap-3 border-b border-[#edf1ee] pb-5 sm:flex-row sm:items-end"
  >
    <div>
      <span class="text-[10px] font-bold uppercase tracking-[0.16em] text-[#4f8b75]"
        >Secure payments</span
      >
      <h2
        class="mt-2 font-display text-2xl font-semibold tracking-[-0.035em] text-[#112211] sm:text-3xl"
      >
        Payment methods
      </h2>
      <p class="mt-1.5 text-sm text-[#6d7972]">
        Cards saved here are available at checkout for faster booking.
      </p>
    </div>
    <span
      class="inline-flex w-fit items-center gap-2 rounded-full bg-[#eff7f3] px-3 py-1.5 text-[10px] font-bold uppercase tracking-[0.12em] text-[#2f6d57]"
    >
      <svg
        class="size-3.5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <rect x="4" y="10" width="16" height="11" rx="2" />
        <path stroke-linecap="round" d="M8 10V7a4 4 0 0 1 8 0v3" />
      </svg>
      Encrypted
    </span>
  </div>

  <div class="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (card of cards(); track card.last4) {
      <article
        class="relative overflow-hidden rounded-[22px] bg-[#112211] p-5 text-white shadow-[0_16px_34px_rgba(17,34,17,0.18)]"
      >
        <div
          class="absolute -right-10 -top-10 size-36 rounded-full bg-[#8DD3BB]/15 blur-xl"
          aria-hidden="true"
        ></div>
        <div class="relative flex items-start justify-between">
          <span class="grid size-9 place-items-center rounded-xl bg-white/10 text-[#8DD3BB]">
            <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4H4V6h16v2Z"
              />
            </svg>
          </span>
          <button
            type="button"
            class="grid size-8 place-items-center rounded-lg bg-white/8 text-white/60 transition hover:bg-white/15 hover:text-white"
            [attr.aria-label]="'Remove card ending ' + card.last4"
            (click)="remove(card)"
          >
            <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12ZM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4Z"
              />
            </svg>
          </button>
        </div>

        <p class="relative mt-8 font-display text-xl tracking-[0.16em] text-white/80">
          •••• •••• •••• {{ card.last4 }}
        </p>
        <div class="relative mt-6 flex items-end justify-between">
          <div>
            <span class="block text-[9px] font-bold uppercase tracking-[0.14em] text-white/35"
              >Valid thru</span
            >
            <span class="mt-1 block text-sm font-semibold">{{ card.expiry }}</span>
          </div>
          <span
            class="rounded-lg bg-[#8DD3BB] px-3 py-1.5 text-[11px] font-extrabold italic tracking-tight text-[#112211]"
          >
            {{ card.brand }}
          </span>
        </div>
      </article>
    }

    <button
      type="button"
      class="group grid min-h-[210px] place-items-center rounded-[22px] border border-dashed border-[#b9d9cc] bg-[#fbfdfc] p-5 text-center transition hover:-translate-y-0.5 hover:border-[#8DD3BB] hover:bg-[#f4faf7] hover:shadow-[0_12px_28px_rgba(17,34,17,0.07)] active:translate-y-0"
      (click)="addCard.emit()"
    >
      <span class="flex flex-col items-center">
        <span
          class="grid size-12 place-items-center rounded-full bg-[#8DD3BB] text-[#112211] transition group-hover:scale-105"
        >
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            aria-hidden="true"
          >
            <path stroke-linecap="round" d="M12 5v14M5 12h14" />
          </svg>
        </span>
        <span class="mt-3 text-sm font-bold text-[#112211]">Add a new card</span>
        <span class="mt-1 text-xs text-[#7b8780]">Your details stay encrypted</span>
      </span>
    </button>
  </div>
</section>
