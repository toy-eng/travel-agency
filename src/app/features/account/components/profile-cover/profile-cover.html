<section
  class="relative overflow-hidden rounded-[30px] bg-[#112211] px-5 py-7 text-white shadow-[0_20px_54px_rgba(17,34,17,0.18)] sm:px-8 sm:py-9"
  aria-label="Profile overview"
>
  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_82%_12%,rgba(141,211,187,0.24),transparent_34%),radial-gradient(circle_at_12%_90%,rgba(141,211,187,0.12),transparent_36%)]"
    aria-hidden="true"
  ></div>
  <div
    class="absolute -right-16 -top-24 size-72 rounded-full border border-white/5 bg-white/[0.025]"
    aria-hidden="true"
  ></div>

  <div class="relative z-10 flex flex-col justify-between gap-8 lg:flex-row lg:items-start">
    <div class="flex flex-col gap-5 sm:flex-row sm:items-center">
      <div class="relative shrink-0">
        <img
          [src]="avatarUrl()"
          alt=""
          class="size-24 rounded-[26px] border-4 border-white/15 object-cover shadow-[0_16px_34px_rgba(0,0,0,0.24)] sm:size-28"
        />
        <span
          class="absolute -bottom-1 -right-1 grid size-8 place-items-center rounded-full border-4 border-[#112211] bg-[#8DD3BB] text-[#112211]"
          aria-hidden="true"
        >
          <svg
            class="size-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </span>
      </div>

      <div class="min-w-0">
        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-[#8DD3BB]">
          Golobe member
        </span>
        <h1
          class="mt-2 font-display text-3xl font-semibold tracking-[-0.04em] sm:text-4xl lg:text-5xl"
        >
          {{ name() }}
        </h1>
        <p class="mt-2 text-sm text-white/60">{{ email() }}</p>
        <div class="mt-4 flex flex-wrap gap-2">
          <span
            class="rounded-full border border-white/12 bg-white/[0.07] px-3 py-1.5 text-[10px] font-bold uppercase tracking-[0.12em] text-white/80"
          >
            Gold member
          </span>
          <span
            class="rounded-full bg-[#8DD3BB] px-3 py-1.5 text-[10px] font-bold uppercase tracking-[0.12em] text-[#112211]"
          >
            Verified traveller
          </span>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap gap-2 sm:justify-end">
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-xl border border-white/15 bg-white/[0.07] px-4 py-2.5 text-xs font-bold text-white transition hover:border-white/25 hover:bg-white/10 active:scale-[0.98]"
        (click)="uploadCover.emit()"
      >
        <svg
          class="size-4 text-[#8DD3BB]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 16V4m0 0L8 8m4-4 4 4M5 15v4h14v-4"
          />
        </svg>
        Upload cover
      </button>
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-xl bg-[#8DD3BB] px-4 py-2.5 text-xs font-bold text-[#112211] transition hover:bg-[#74C0A3] active:scale-[0.98]"
        (click)="changeAvatar.emit()"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25ZM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z"
          />
        </svg>
        Change photo
      </button>
    </div>
  </div>

  <div
    class="relative z-10 mt-8 grid grid-cols-2 gap-2 border-t border-white/10 pt-6 sm:grid-cols-4 sm:gap-4"
  >
    <div class="rounded-2xl bg-white/[0.055] px-4 py-3">
      <span class="block text-[10px] font-semibold uppercase tracking-[0.12em] text-white/40"
        >Member since</span
      >
      <strong class="mt-1 block text-sm text-white">March 2024</strong>
    </div>
    <div class="rounded-2xl bg-white/[0.055] px-4 py-3">
      <span class="block text-[10px] font-semibold uppercase tracking-[0.12em] text-white/40"
        >Trips planned</span
      >
      <strong class="mt-1 block text-sm text-white">3 journeys</strong>
    </div>
    <div class="rounded-2xl bg-white/[0.055] px-4 py-3">
      <span class="block text-[10px] font-semibold uppercase tracking-[0.12em] text-white/40"
        >Saved places</span
      >
      <strong class="mt-1 block text-sm text-white">12 stops</strong>
    </div>
    <div class="rounded-2xl bg-white/[0.055] px-4 py-3">
      <span class="block text-[10px] font-semibold uppercase tracking-[0.12em] text-white/40"
        >Support</span
      >
      <strong class="mt-1 block text-sm text-white">24/7 access</strong>
    </div>
  </div>
</section>
