<section class="space-y-6 border-t border-[rgba(17,34,17,0.08)] pt-8" aria-labelledby="reviews-title">
  <div class="flex items-center justify-between gap-4">
    <h2 id="reviews-title" class="font-display text-[1.15rem] font-bold text-[#112211]">Reviews</h2>

    <button
      type="button"
      class="inline-flex h-[40px] items-center justify-center rounded-[8px] bg-[#8DD3BB] px-5 text-[0.82rem] font-bold text-[#112211] transition-colors hover:bg-[#7ac7ae]"
    >
      Give your review
    </button>
  </div>

  <div class="flex items-baseline gap-3">
    <strong class="font-display text-[2.1rem] font-extrabold leading-none text-[#112211]">{{ rating().toFixed(1) }}</strong>
    <div class="flex flex-col">
      <span class="text-[0.95rem] font-semibold text-[#112211]">{{ ratingLabel() }}</span>
      <span class="text-[0.78rem] text-[#67757A]">{{ reviewCount() }} verified reviews</span>
    </div>
  </div>

  <ul class="border-t border-[rgba(17,34,17,0.08)]">
    @for (review of reviews(); track review.name) {
      <li class="flex items-start gap-4 border-b border-[rgba(17,34,17,0.08)] py-5">
        <img
          [src]="review.avatar"
          width="44"
          height="44"
          alt=""
          class="h-11 w-11 shrink-0 rounded-full object-cover"
        />

        <div class="min-w-0 flex-1">
          <p class="flex flex-wrap items-center gap-2 text-[0.88rem]">
            <strong class="font-semibold text-[#112211]">{{ review.score }} {{ review.label }}</strong>
            <span class="text-[#c9d1ce]" aria-hidden="true">|</span>
            <span class="text-[#52635c]">{{ review.name }}</span>
          </p>
          <p class="mt-2 text-[0.88rem] leading-[1.65] text-[#52635c]">{{ review.text }}</p>
        </div>

        <button
          type="button"
          class="mt-1 grid h-7 w-7 shrink-0 place-items-center rounded text-[#52635c] transition-colors hover:bg-[#f3f7f5] hover:text-[#112211]"
          aria-label="Report review"
        >
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M6 3v18H4V3h2Zm2 1h10.5l-1.8 4 1.8 4H8V4Z"/>
          </svg>
        </button>
      </li>
    }
  </ul>

  <nav class="flex items-center justify-center gap-5 pt-2" aria-label="Reviews pagination">
    <button
      type="button"
      class="grid h-8 w-8 place-items-center rounded text-[#112211] transition-colors disabled:cursor-not-allowed disabled:opacity-30"
      [disabled]="!canGoPrevious()"
      aria-label="Previous page"
      (click)="goToPrevious()"
    >
      <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>

    <span class="text-[0.88rem] text-[#52635c]">
      <strong class="font-semibold text-[#112211]">{{ currentPage() }}</strong> of {{ totalPages() }}
    </span>

    <button
      type="button"
      class="grid h-8 w-8 place-items-center rounded text-[#112211] transition-colors disabled:cursor-not-allowed disabled:opacity-30"
      [disabled]="!canGoNext()"
      aria-label="Next page"
      (click)="goToNext()"
    >
      <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </button>
  </nav>
</section>
