<section class="space-y-4 border-t border-[rgba(17,34,17,0.08)] pt-8" aria-labelledby="location-title">
  <div class="flex items-center justify-between gap-4">
    <h2 id="location-title" class="font-display text-[1.15rem] font-bold text-[#112211]">Location/Map</h2>

    <a
      [href]="mapsUrl()"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex h-[40px] items-center justify-center rounded-[8px] bg-[#8DD3BB] px-5 text-[0.82rem] font-bold text-[#112211] transition-colors hover:bg-[#7ac7ae]"
    >
      View on google maps
    </a>
  </div>

  <div class="overflow-hidden rounded-[12px] border border-[rgba(17,34,17,0.08)] bg-[#eef3f1]">
    <iframe
      [src]="safeMapEmbedUrl()"
      title="Map showing CVK Park Bosphorus Hotel Istanbul"
      class="h-[300px] w-full border-0 sm:h-[360px]"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </div>

  <p class="flex items-start gap-1.5 text-[0.82rem] text-[#52635c]">
    <svg class="mt-0.5 h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
    <span>{{ address() }}</span>
  </p>
</section>
