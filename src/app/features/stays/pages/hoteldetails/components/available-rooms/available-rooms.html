<section class="space-y-5 border-t border-[rgba(17,34,17,0.08)] pt-8" aria-labelledby="rooms-title">
  <h2 id="rooms-title" class="font-display text-[1.15rem] font-bold text-[#112211]">Available Rooms</h2>

  <ul>
    @for (room of rooms(); track $index) {
      <li class="flex flex-col gap-4 border-b border-[rgba(17,34,17,0.08)] py-5 last:border-b-0 sm:flex-row sm:items-center sm:gap-5">
        <div class="flex min-w-0 flex-1 items-center gap-4">
          <img
            [src]="room.image"
            width="72"
            height="72"
            alt=""
            class="h-[54px] w-[72px] shrink-0 rounded-[8px] object-cover"
          />
          <span class="text-[0.95rem] font-medium text-[#112211]">{{ room.name }}</span>
        </div>

        <div class="flex items-center justify-between gap-6 sm:justify-end">
          <p class="shrink-0 text-right">
            <strong class="font-display text-[1.35rem] font-extrabold text-[#112211]">{{ room.price }}</strong>
            <span class="text-[0.78rem] text-[#52635c]">/night</span>
          </p>

          <a
            routerLink="/stays/hotelbookingdetails"
            class="inline-flex h-[42px] w-[130px] shrink-0 items-center justify-center rounded-[8px] bg-[#8DD3BB] text-[0.82rem] font-bold text-[#112211] transition-colors hover:bg-[#7ac7ae]"
          >
            Book now
          </a>
        </div>
      </li>
    }
  </ul>
</section>
