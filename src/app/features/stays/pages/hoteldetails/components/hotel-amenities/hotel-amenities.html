<section class="space-y-5 border-t border-[rgba(17,34,17,0.08)] pt-8" aria-labelledby="amenities-title">
  <h2 id="amenities-title" class="font-display text-[1.15rem] font-bold text-[#112211]">Amenities</h2>

  <ul class="grid grid-cols-1 gap-x-10 gap-y-4 sm:grid-cols-2">
    @for (amenity of amenities(); track $index) {
      <li class="flex items-center gap-3 text-[0.92rem] text-[#112211]">
        <span class="grid h-6 w-6 shrink-0 place-items-center text-[#112211]" aria-hidden="true">
          @switch (amenity.icon) {
            @case ('pool') {
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M2 16h20M4 16a8 8 0 0 1 16 0M12 5.5V8M8 20h8"/>
              </svg>
            }
            @case ('fitness') {
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6.5 6.5v11M4 8.5v7M17.5 6.5v11M20 8.5v7M6.5 12h11"/>
              </svg>
            }
            @case ('spa') {
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 21c4-1.5 7-5 7-9.5-3.6 0-6.4 1.8-7 4.6-.6-2.8-3.4-4.6-7-4.6C5 16 8 19.5 12 21ZM12 3c-1.4 1.6-2 3-2 4.4 0 1 .5 1.9 2 3.1 1.5-1.2 2-2.1 2-3.1C14 6 13.4 4.6 12 3Z"/>
              </svg>
            }
            @case ('restaurant') {
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M7 2v8a2.5 2.5 0 0 0 2 2.45V22h2V2H9v6H8V2H7Zm10 0c-1.7 0-3 2-3 4.5 0 2 .8 3.6 2 4.2V22h2V2h-1Z"/>
              </svg>
            }
            @case ('room') {
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M3 12h18v7h-2v-2H5v2H3v-7Zm3-2a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v1H6v-1Z"/>
              </svg>
            }
            @case ('bar') {
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M4 4h16l-7 8v6h4v2H7v-2h4v-6L4 4Z"/>
              </svg>
            }
            @case ('wifi') {
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M2.5 8.5a15 15 0 0 1 19 0M5.5 12a10.5 10.5 0 0 1 13 0M8.5 15.5a6 6 0 0 1 7 0"/>
                <circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/>
              </svg>
            }
            @default {
              <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M4 8h13a3 3 0 0 1 0 6h-1.2a5.5 5.5 0 0 1-10.6 0H4a4 4 0 0 1 0-8V8Zm14 2v2h1a1 1 0 0 0 0-2h-1ZM3 19h18v2H3v-2Z"/>
              </svg>
            }
          }
        </span>
        <span class="font-medium">{{ amenity.label }}</span>
      </li>
    }
  </ul>

  <button type="button" class="border-0 bg-transparent p-0 text-[0.9rem] font-semibold text-[#f26a5e] hover:underline">
    +24 more
  </button>
</section>
