<article class="grid grid-cols-[300px_minmax(0,1fr)] overflow-hidden rounded-[18px] border border-[rgba(17,34,17,0.08)] bg-white shadow-[0_12px_26px_rgba(17,34,17,0.06)] max-md:grid-cols-1">
  <div class="relative min-h-[240px] overflow-hidden bg-[#dfeaf7]">
    <div
      class="absolute inset-0 bg-cover bg-center transition-transform duration-500 ease-out hover:scale-[1.04]"
      [style.backgroundImage]="'url(' + imageUrl() + ')'"
      [attr.aria-label]="name()"
    ></div>

    @if (imageCount() > 0) {
      <span class="absolute left-3 top-3 inline-flex items-center rounded-[10px] bg-[rgba(255,255,255,0.82)] px-3 py-1.5 text-[0.73rem] font-medium text-[#112211] shadow-sm backdrop-blur-sm">
        {{ imageCount() }} images
      </span>
    }
  </div>

  <div class="flex min-w-0 flex-col p-6 pr-5">
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <h3 class="m-0 text-[20px] font-[TradeGothic,Arial,sans-serif] font-bold leading-[1.08] tracking-[-0.03em] text-[#112211]">{{ name() }}</h3>
      </div>

      <div class="shrink-0 text-right">
        <span class="block text-[0.8rem] text-[#67757A]">starting from</span>
        <div class="mt-1 leading-none">
          <strong class="text-[2.1rem] font-extrabold text-[#f26a5e]">{{ pricePerNight() }}</strong>
          <span class="text-[0.9rem] text-[#67757A]">/night</span>
        </div>
        <span class="block text-[0.75rem] text-[#67757A]">{{ priceNote() }}</span>
      </div>
    </div>

    <div class="mt-3 flex items-center gap-2 text-[0.95rem] text-[#67757A]">
      <svg class="h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      <span>{{ location() }}</span>
    </div>

    <div class="mt-4 flex items-center gap-3 text-[0.95rem] text-[#112211]">
      <div class="flex items-center gap-1 text-[#f26a5e]">
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="m12 17.27 6.18 3.73-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21l6.18-3.73z"/>
        </svg>
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="m12 17.27 6.18 3.73-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21l6.18-3.73z"/>
        </svg>
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="m12 17.27 6.18 3.73-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21l6.18-3.73z"/>
        </svg>
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="m12 17.27 6.18 3.73-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21l6.18-3.73z"/>
        </svg>
        <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="m12 17.27 6.18 3.73-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21l6.18-3.73z"/>
        </svg>
      </div>
      <span class="font-semibold">5 Star Hotel</span>
      <span class="mx-1 text-[#d1d7d5]">•</span>
      <span class="flex items-center gap-1.5 font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true" class="h-4 w-4 text-[#112211]">
          <path d="M0 0h24v24H0z" fill="none"/>
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path stroke-width="5" d="M2 16h20" opacity=".2"/>
            <path stroke-width="5" d="M4 16a8 8 0 0 1 16 0" opacity=".2"/>
            <path stroke-width="5" d="M12 5.5V8" opacity=".2"/>
            <path stroke-width="5" d="M8 20h8" opacity=".2"/>
            <path d="M2 16h20"/>
            <path d="M4 16a8 8 0 0 1 16 0"/>
            <path d="M12 5.5V8"/>
            <path d="M8 20h8"/>
          </g>
        </svg>
        20+ Amenities
      </span>
    </div>

    <div class="flex items-center gap-2 pt-4">
      <span class="inline-grid min-h-[2rem] min-w-[2.2rem] place-items-center rounded-[8px] border border-[#dbeae5] bg-[#f2faf7] text-[0.9rem] font-bold text-[#112211]">{{ rating().toFixed(1) }}</span>
      <span class="text-[0.9rem] font-medium text-[#112211]">Very Good</span>
      <span class="text-[0.8rem] text-[#67757A]">{{ reviewCount() }} reviews</span>
    </div>

    <div class="mt-4 flex items-center gap-3 border-t border-[rgba(17,34,17,0.08)] pt-4">
      <button
        type="button"
        class="flex h-[52px] w-[52px] shrink-0 items-center justify-center rounded-[10px] border border-[rgba(17,34,17,0.12)] bg-white text-[#112211] shadow-sm transition-colors hover:bg-[#f5f7f6]"
        aria-label="Save hotel"
      >
        <svg class="h-5 w-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5A4.5 4.5 0 0 1 6.5 4c1.74 0 3.41.81 4.5 2.09A6.07 6.07 0 0 1 15.5 4 4.5 4.5 0 0 1 20 8.5c0 3.78-3.4 6.86-8.55 11.5L12 21.35Z"/>
        </svg>
      </button>

      <a routerLink="/stays/hoteldetails" class="flex h-[52px] flex-1 items-center justify-center rounded-[12px] bg-[#8DD3BB] text-[1.05rem] font-bold text-[#112211] transition-colors hover:bg-[#7ac7ae]">
        View Place
      </a>
    </div>
  </div>
</article>
