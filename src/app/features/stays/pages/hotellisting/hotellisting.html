<main class="mx-auto max-w-[1240px] px-4 py-8 pb-16 text-[#112211] sm:px-6">
  <!-- Search Form -->
  <section class="mb-8 border border-[rgba(17,34,17,0.08)] rounded-[18px] bg-[rgba(255,255,255,0.9)] shadow-[0_8px_22px_rgba(17,34,17,0.05)] p-4 sm:p-[1.1rem]">
    <form (submit)="$event.preventDefault()" class="grid grid-cols-[repeat(4,minmax(0,1fr))_auto] gap-3.5 items-end max-lg:grid-cols-2">
      <div class="relative">
        <label class="absolute -top-2 left-3 z-10 bg-white px-1 text-[11px] font-medium text-[#112211]">
          Enter Destination
        </label>
        <div class="flex h-[56px] items-center rounded-[4px] border border-[#79747E] bg-white px-3 transition-colors focus-within:border-[#8DD3BB] focus-within:shadow-[0_0_0_1px_#8DD3BB]">
          <svg class="mr-2 h-5 w-5 shrink-0 text-[#6B7280]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M0 0h24v24H0z" fill="none"/>
            <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V6H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
          </svg>
          <input
            type="text"
            [ngModel]="destination()"
            (ngModelChange)="destination.set($event)"
            name="destination"
            class="w-full border-0 bg-transparent text-[15px] font-medium text-[#112211] outline-none placeholder:text-[#6B7280]"
            placeholder="Enter destination"
          />
        </div>
      </div>

      <div class="relative">
        <label class="absolute -top-2 left-3 z-10 bg-white px-1 text-[11px] font-medium text-[#112211]">
          Check In
        </label>
        <div class="flex h-[56px] items-center rounded-[4px] border border-[#79747E] bg-white px-3 transition-colors focus-within:border-[#8DD3BB] focus-within:shadow-[0_0_0_1px_#8DD3BB]">
          <input
            type="text"
            [ngModel]="checkIn()"
            (ngModelChange)="checkIn.set($event)"
            name="checkIn"
            class="w-full border-0 bg-transparent text-[15px] font-medium text-[#112211] outline-none placeholder:text-[#6B7280]"
            placeholder="Check In"
          />
          <button type="button" class="ml-2 flex h-8 w-8 items-center justify-center rounded-md text-[#112211] transition-colors hover:bg-[#F3F7F5]" aria-label="Select check-in date">
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="relative">
        <label class="absolute -top-2 left-3 z-10 bg-white px-1 text-[11px] font-medium text-[#112211]">
          Check Out
        </label>
        <div class="flex h-[56px] items-center rounded-[4px] border border-[#79747E] bg-white px-3 transition-colors focus-within:border-[#8DD3BB] focus-within:shadow-[0_0_0_1px_#8DD3BB]">
          <input
            type="text"
            [ngModel]="checkOut()"
            (ngModelChange)="checkOut.set($event)"
            name="checkOut"
            class="w-full border-0 bg-transparent text-[15px] font-medium text-[#112211] outline-none placeholder:text-[#6B7280]"
            placeholder="Check Out"
          />
          <button type="button" class="ml-2 flex h-8 w-8 items-center justify-center rounded-md text-[#112211] transition-colors hover:bg-[#F3F7F5]" aria-label="Select check-out date">
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="relative">
        <label class="absolute -top-2 left-3 z-10 bg-white px-1 text-[11px] font-medium text-[#112211]">
          Rooms &amp; Guests
        </label>
        <button
          type="button"
          class="flex h-[56px] w-full items-center justify-between rounded-[4px] border border-[#79747E] bg-white px-3 text-left transition-colors hover:border-[#8DD3BB] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#8DD3BB]"
          aria-label="Select room and guest count"
        >
          <div class="flex items-center gap-2 overflow-hidden">
            <svg class="h-5 w-5 shrink-0 text-[#6B7280]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M0 0h24v24H0z" fill="none"/>
              <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V6H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
            </svg>
            <span class="truncate text-[15px] font-medium text-[#112211]">{{ guests() }}</span>
          </div>
          <svg class="h-4 w-4 shrink-0 text-[#112211]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M0 0h24v24H0z" fill="none"/>
            <path fill="currentColor" fill-rule="evenodd" d="M16.53 8.97a.75.75 0 0 1 0 1.06l-4 4a.75.75 0 0 1-1.06 0l-4-4a.75.75 0 1 1 1.06-1.06L12 12.44l3.47-3.47a.75.75 0 0 1 1.06 0" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>

      <button
        type="button"
        class="inline-flex items-center justify-center w-[56px] h-[56px] border-0 rounded-[10px] bg-mint text-[#112211] cursor-pointer shadow-[0_8px_18px_rgba(141,211,187,0.3)] transition-colors hover:bg-mint-dark"
        aria-label="Search hotels"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" class="w-[22px] h-[22px] fill-current">
          <path d="M10.5 3a7.5 7.5 0 015.96 12.12l4.72 4.72 1.41-1.41-4.72-4.72A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z" />
        </svg>
      </button>
    </form>
  </section>

  <!-- Results Area -->
  <section class="relative grid grid-cols-[290px_minmax(0,1fr)] gap-7 items-start max-lg:grid-cols-1">
    <div class="w-full">
      <app-hotel-filter-sidebar />
    </div>

    <div class="min-w-0">
      <section class="mb-6 overflow-hidden rounded-[14px] border border-[rgba(17,34,17,0.04)] bg-white shadow-[0_8px_24px_rgba(17,34,17,0.07)]" role="group" aria-label="Hotel category tabs">
        <div class="grid grid-cols-3">
          @for (category of categories; track category.name) {
            <button
              type="button"
              class="relative flex flex-col items-center justify-center gap-1 border-0 bg-transparent px-6 py-5 text-left text-[#112211] transition-colors hover:bg-[#f2faf7]"
              [class.bg-[#eaf8f4]]="activeCategory() === category.name"
              [class.shadow-[inset_0_-3px_0_0_#8DD3BB]]="activeCategory() === category.name"
              [attr.aria-pressed]="activeCategory() === category.name"
              (click)="activeCategory.set(category.name)"
            >
              <span class="text-[1.08rem] font-bold">{{ category.name }}</span>
              <span class="text-[0.9rem] font-normal text-[#a4ada9]">{{ category.count }} places</span>
            </button>
          }
        </div>
      </section>

      <app-hotel-results-toolbar
        [resultCount]="hotels.length"
        [totalPlaces]="257"
        [selectedSort]="selectedSort"
        [sortOptions]="sortOptions"
        (sortChange)="onSortChange($event)"
      />

      <div class="flex flex-col gap-5">
        @for (hotel of hotels; track hotel.name) {
          <app-hotel-card
            [name]="hotel.name"
            [location]="hotel.location"
            [pricePerNight]="hotel.pricePerNight"
            [priceNote]="hotel.priceNote"
            [imageUrl]="hotel.imageUrl"
            [imageCount]="hotel.imageCount"
            [rating]="hotel.rating"
            [reviewCount]="hotel.reviewCount"
          />
        }
      </div>

      <div class="mt-8 text-center">
        <button
          type="button"
          class="w-full bg-show-more rounded-lg border-2 px-6 py-3.5 text-[0.92rem] font-extrabold text-white cursor-pointer transition-all hover:bg-mint hover:-translate-y-0.5"
        >
          Show more results
        </button>
      </div>
    </div>
  </section>
</main>
