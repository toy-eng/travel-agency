<div class="flex flex-col gap-5 mb-7">
  <div class="flex min-h-[84px] overflow-hidden border border-[rgba(17,34,17,0.04)] rounded-[14px] bg-white shadow-[0_8px_24px_rgba(17,34,17,0.07)]" aria-label="Sort flight results">
    <div class="grid grid-cols-3 flex-1 max-md:block max-md:min-h-[84px]" role="group" aria-label="Primary sort options">
      @for (option of sortOptions.slice(0, 3); track option) {
        <button
          type="button"
          class="relative flex flex-col justify-center gap-[0.35rem] min-w-0 py-[0.85rem] px-6 border-0 border-r border-[#dbe6e4] bg-transparent text-[#112211] text-left cursor-pointer transition-colors hover:bg-[#f2faf7] max-md:py-3 max-md:px-3"
          [class.sort-option--active]="selectedSort === option"
          [attr.aria-pressed]="selectedSort === option"
          (click)="onSortChange(option)"
        >
          <span class="overflow-hidden text-[1.08rem] font-bold text-ellipsis whitespace-nowrap max-md:text-[0.9rem]">{{ option }}</span>
          <span class="text-[#a4ada9] text-[0.9rem] font-normal whitespace-nowrap max-md:text-[0.75rem]">$99 · 2h 18m</span>
        </button>
      }
    </div>

    <label class="relative flex items-center basis-[226px] gap-3 px-6 text-[#112211] cursor-pointer max-md:min-h-[60px] max-md:border-t max-md:border-[#dbe6e4]" for="flight-sort">
      <span class="inline-flex flex-col justify-center gap-1 w-5" aria-hidden="true">
        <span class="block w-[19px] h-[2px] rounded-sm bg-current"></span>
        <span class="block w-[13px] h-[2px] rounded-sm bg-current"></span>
        <span class="block w-[7px] h-[2px] rounded-sm bg-current"></span>
      </span>
      <span class="text-[0.98rem] font-medium whitespace-nowrap">Other sort</span>
      <select id="flight-sort" class="absolute inset-0 w-full h-full cursor-pointer opacity-0" [value]="selectedSort" (change)="onSortChange($event)">
        @for (option of sortOptions.slice(3); track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </label>
  </div>

  <div class="flex items-center justify-between gap-4 px-[0.1rem] max-md:flex-col max-md:items-start">
    <p class="m-0 text-[#112211] text-[0.95rem] font-medium">Showing <strong class="text-[#ff706c]">{{ resultCount }}</strong> of <strong class="text-[#ff706c]">{{ totalPlaces }}</strong> places</p>

    <div class="relative inline-flex items-center gap-[0.18rem] text-[#112211] text-[0.95rem] whitespace-nowrap">
      <span>Sort by</span>
      <button
        type="button"
        class="inline-flex items-center gap-[0.28rem] p-0 border-0 bg-transparent text-[#112211] font-[inherit] font-bold cursor-pointer outline-none focus-visible:text-mint-dark focus-visible:outline-none"
        aria-haspopup="listbox"
        [attr.aria-expanded]="secondarySortOpen()"
        (click)="toggleSecondarySort()"
      >
        <span>{{ activeSecondarySort() }}</span>
        <span class="w-[7px] h-[7px] border-r-2 border-b-2 border-current -translate-y-0.5 rotate-45 pointer-events-none transition-transform" [class.translate-y-0.5]="secondarySortOpen()" [class.rotate-[225deg]]="secondarySortOpen()" aria-hidden="true"></span>
      </button>

      @if (secondarySortOpen()) {
        <div class="absolute z-10 top-[calc(100%+0.6rem)] right-0 min-w-[9.5rem] p-1.5 border border-[rgba(141,211,187,0.4)] rounded-lg bg-white shadow-[0_10px_24px_rgba(17,34,17,0.12)]" role="listbox" aria-label="Sort flight results by">
          @for (option of sortOptions; track option) {
            <button
              type="button"
              class="block w-full py-2 px-[0.7rem] border-0 rounded-[5px] bg-transparent text-[#112211] font-[inherit] text-[0.88rem] text-left cursor-pointer hover:bg-[#edf8f4] hover:text-[#214d40] focus-visible:bg-[#edf8f4] focus-visible:outline-none"
              [class.bg-[#edf8f4]]="activeSecondarySort() === option"
              [class.text-[#214d40]]="activeSecondarySort() === option"
              role="option"
              [attr.aria-selected]="activeSecondarySort() === option"
              (click)="selectSecondarySort(option)"
            >
              {{ option }}
            </button>
          }
        </div>
      }
    </div>
  </div>
</div>
