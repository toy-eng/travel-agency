<article class="rounded-xl bg-white px-4 py-5 text-[#112211] shadow-[0_8px_22px_rgba(17,34,17,0.06)] sm:px-6 sm:py-6">
  <header class="flex items-center justify-between">
    <h3 class="text-base font-semibold sm:text-lg">{{ date() }}</h3>
    <span class="text-sm text-[#52635c] font-medium sm:text-base">{{ duration() }}</span>
  </header>

  <div class="mt-5 grid gap-5 lg:grid-cols-[185px_minmax(0,1fr)] lg:gap-x-8">
    <div class="flex h-[67px] items-center gap-4 rounded-md border border-[#b9e4d6] px-4">
      <div class="flex w-[48px] flex-col items-center text-[#e63146]" aria-label="Emirates">
        <span class="text-[1.35rem] leading-none" aria-hidden="true">✦</span>
        <span class="font-display text-[0.68rem] font-extrabold leading-none">Emirates</span>
      </div>
      <div class="border-l border-[#dfe5e2] pl-4">
        <strong class="block text-lg leading-none">Emirates</strong>
        <small class="mt-2 block text-[0.68rem] text-[#71807a]">Airbus A320</small>
      </div>
    </div>

    <div class="flex items-center justify-end gap-1.5 text-[#112211] sm:gap-2" aria-label="Flight services">
      <span class="grid size-10 place-items-center" aria-label="Flight">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" class="size-6 fill-current" aria-hidden="true">
          <path d="M0 0h1200v1200H0z" fill="none" />
          <path fill="currentColor" d="M321 1164h120l269.28-480.06H1020s180 0 180-83.94c0-84-180-84-180-84H710.28L441 36H321l149.28 480H255.06L120 395.94H0l96.06 204L0 804h120l135.06-120.06h215.22z" />
        </svg>
      </span>
      <span class="h-10 border-l border-[#dfe5e2]"></span>
      <span class="grid size-10 place-items-center" aria-label="Wi-Fi">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="size-6 fill-current" aria-hidden="true">
          <path d="M0 0h1024v1024H0z" fill="none" />
          <path fill="currentColor" d="M723 620.5C666.8 571.6 593.4 542 513 542s-153.8 29.6-210.1 78.6a8.1 8.1 0 0 0-.8 11.2l36 42.9c2.9 3.4 8 3.8 11.4.9C393.1 637.2 450.3 614 513 614s119.9 23.2 163.5 61.5c3.4 2.9 8.5 2.5 11.4-.9l36-42.9c2.8-3.3 2.4-8.3-.9-11.2m117.4-140.1C751.7 406.5 637.6 362 513 362s-238.7 44.5-327.5 118.4a8.05 8.05 0 0 0-1 11.3l36 42.9c2.8 3.4 7.9 3.8 11.2 1C308 472.2 406.1 434 513 434s205 38.2 281.2 101.6c3.4 2.8 8.4 2.4 11.2-1l36-42.9c2.8-3.4 2.4-8.5-1-11.3m116.7-139C835.7 241.8 680.3 182 511 182c-168.2 0-322.6 59-443.7 157.4a8 8 0 0 0-1.1 11.4l36 42.9c2.8 3.3 7.8 3.8 11.1 1.1C222 306.7 360.3 254 511 254c151.8 0 291 53.5 400 142.7c3.4 2.8 8.4 2.3 11.2-1.1l36-42.9c2.9-3.4 2.4-8.5-1.1-11.3M448 778a64 64 0 1 0 128 0a64 64 0 1 0-128 0" />
        </svg>
      </span>
      <span class="h-10 border-l border-[#dfe5e2]"></span>
      <span class="grid size-10 place-items-center" aria-label="Departure time">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" class="size-5 fill-current" aria-hidden="true">
          <path d="M0 0h16v16H0z" fill="none" />
          <path fill="currentColor" d="M6.5 0a.5.5 0 0 0 0 1H7v1.07A7.001 7.001 0 0 0 8 16a7 7 0 0 0 5.29-11.584l.013-.012l.354-.354l.353.354a.5.5 0 1 0 .707-.707l-1.414-1.415a.5.5 0 1 0-.707.707l.354.354l-.354.354l-.012.012A6.97 6.97 0 0 0 9 2.071V1h.5a.5.5 0 0 0 0-1zm2 5.6V9a.5.5 0 0 1-.5.5H4.5a.5.5 0 0 1 0-1h3V5.6a.5.5 0 1 1 1 0" />
        </svg>
      </span>
      <span class="h-10 border-l border-[#dfe5e2]"></span>
      <span class="grid size-10 place-items-center" aria-label="Baggage">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-6 fill-current" aria-hidden="true">
          <path d="M0 0h24v24H0z" fill="none" />
          <path fill="currentColor" d="M2.442 15.385q0-2.187 2.064-3.209t4.552-1.022t4.552 1.022t2.063 3.209zm0 3.307v-1h13.231v1zM3.212 22q-.31 0-.54-.23t-.23-.54V21h13.231v.23q0 .31-.23.54t-.54.23zm14.461 0v-6.615q0-2.35-1.757-3.925q-1.758-1.576-4.16-2.064l-.429-3.012h4.615v-4h1v4h4.616l-1.452 14.162q-.056.621-.522 1.038q-.467.416-1.088.416z" />
        </svg>
      </span>
      <span class="h-10 border-l border-[#dfe5e2]"></span>
      <span class="grid size-10 place-items-center" aria-label="Accessibility">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-6 fill-current" aria-hidden="true">
          <path d="M0 0h24v24H0z" fill="none" />
          <path fill="currentColor" d="M9 19h6v2H9c-2.76 0-5-2.24-5-5V7h2v9c0 1.66 1.34 3 3 3m1.42-13.59c.78-.78.78-2.05 0-2.83s-2.05-.78-2.83 0s-.78 2.05 0 2.83c.78.79 2.04.79 2.83 0M11.5 9c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v6c0 1.66.9 3 3 3h5.07l3.5 3.5L20 20.07L14.93 15H11.5z" />
        </svg>
      </span>
    </div>

    <div class="grid grid-cols-[minmax(115px,1fr)_minmax(80px,1.2fr)_minmax(115px,1fr)] items-center gap-3 lg:col-span-2 lg:mt-1">
      <div class="text-right">
        <strong class="block text-lg font-bold sm:text-xl">12:00 pm</strong>
        <small class="mt-1 block text-xs text-[#71807a]">{{ departureAirport() }}</small>
      </div>

      <div class="flex items-center gap-3" aria-label="Flight route">
        <span class="h-[2px] flex-1 bg-[#112211]"></span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" class="size-8 shrink-0 fill-current" aria-hidden="true">
          <path d="M0 0h1200v1200H0z" fill="none" />
          <path fill="currentColor" d="M321 1164h120l269.28-480.06H1020s180 0 180-83.94c0-84-180-84-180-84H710.28L441 36H321l149.28 480H255.06L120 395.94H0l96.06 204L0 804h120l135.06-120.06h215.22z" />
        </svg>
        <span class="h-[2px] flex-1 bg-[#112211]"></span>
      </div>

      <div>
        <strong class="block text-lg font-bold sm:text-xl">12:00 pm</strong>
        <small class="mt-1 block text-xs text-[#71807a]">{{ arrivalAirport() }}</small>
      </div>
    </div>
  </div>
</article>
