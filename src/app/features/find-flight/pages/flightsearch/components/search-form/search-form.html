<section class="relative z-30 mx-auto -mt-32 max-w-[1240px] px-4 sm:-mt-22 sm:px-6">
  <div
    #searchCard
    class="spotlight-card relative overflow-hidden rounded-[16px] border border-gray-100/80 bg-white p-6 shadow-[0_4px_30px_rgba(0,0,0,0.12)] backdrop-blur-sm sm:p-8"
  >
    <div class="spotlight-card__glow" aria-hidden="true"></div>
    <p class="text-lg font-bold text-[#112211] sm:text-xl">Where are you flying?</p>

    <form (submit)="$event.preventDefault()" class="mt-6">
      <div #fieldGrid class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
        <app-floating-field
          label="From - To"
          [ngModel]="fromLocation() + ' - ' + toLocation()"
          (ngModelChange)="fromLocation.set($event)"
          name="fromTo"
        >
          <button
            type="button"
            (click)="swapLocations()"
            title="Swap origin and destination"
            class="motion-tap ml-2 flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-full text-[#112211] transition-colors hover:bg-gray-100 hover:text-[#74C0A3]"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"
              />
            </svg>
          </button>
        </app-floating-field>

        <app-floating-field
          label="Trip"
          type="select"
          [options]="['Return', 'One Way', 'Multi-City']"
          [ngModel]="tripType()"
          (ngModelChange)="tripType.set($event)"
          name="tripType"
        />
        <app-floating-field
          label="Depart- Return"
          [ngModel]="departReturn()"
          (ngModelChange)="departReturn.set($event)"
          name="departReturn"
        />
        <app-floating-field
          label="Passenger - Class"
          [ngModel]="passengerClass()"
          (ngModelChange)="passengerClass.set($event)"
          name="passengerClass"
        />
      </div>

      <div #formActions class="mt-8 flex flex-col items-center justify-end gap-6 pt-2 sm:flex-row">
        <div class="flex items-center gap-3">
          @if (appliedPromo()) {
            <span
              class="inline-flex items-center gap-1.5 rounded-md bg-[#8DD3BB]/25 px-3 py-1.5 text-xs font-bold text-[#112211]"
              [@quickSwap]
            >
              ✓ Code: {{ appliedPromo() }}
              <button
                type="button"
                (click)="appliedPromo.set(null)"
                class="motion-tap ml-1 cursor-pointer text-gray-600 hover:text-black"
                aria-label="Remove promo code"
              >
                &times;
              </button>
            </span>
          } @else if (showPromoInput()) {
            <div [@quickSwap] class="flex items-center gap-2">
              <input
                type="text"
                [ngModel]="promoCode()"
                (ngModelChange)="promoCode.set($event)"
                name="promoCode"
                placeholder="Enter code"
                class="h-9 w-32 rounded-md border border-gray-300 px-3 text-xs font-medium uppercase text-[#112211] outline-none focus:border-[#8DD3BB]"
              />
              <button
                type="button"
                (click)="applyPromo()"
                class="motion-tap cursor-pointer rounded-md bg-[#112211] px-3 py-1.5 text-xs font-semibold text-white transition-colors hover:bg-black"
              >
                Apply
              </button>
            </div>
          } @else {
            <button
              type="button"
              [@quickSwap]
              (click)="togglePromo()"
              class="flex cursor-pointer items-center gap-1.5 text-sm font-semibold text-[#112211] transition-colors hover:text-[#74C0A3]"
            >
              <span class="text-base font-bold">+</span>
              <span>Add Promo Code</span>
            </button>
          }
        </div>

        <button
          type="button"
          [routerLink]="'/find-flight/flightlisting'"
          class="motion-rise inline-flex h-[48px] w-full cursor-pointer items-center justify-center gap-2 rounded-[4px] bg-[#8DD3BB] px-6 text-sm font-semibold text-[#112211] shadow-sm transition-all hover:bg-[#74C0A3] active:scale-[0.99] sm:w-auto"
        >
          <svg class="h-4 w-4 rotate-45 fill-current" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
          <span>Show Flights</span>
        </button>
      </div>
    </form>
  </div>
</section>
