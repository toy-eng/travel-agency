<main class="mx-auto max-w-[1240px] px-4 py-8 pb-16 text-[#112211] sm:px-6">
  <section scrollReveal class="mb-8 border border-[rgba(17,34,17,0.08)] rounded-[18px] bg-[rgba(255,255,255,0.9)] shadow-[0_8px_22px_rgba(17,34,17,0.05)] p-4 sm:p-[1.1rem]">
    <form (submit)="$event.preventDefault()" class="grid grid-cols-[repeat(4,minmax(0,1fr))_auto] gap-3.5 items-end max-lg:grid-cols-2">
      <app-floating-field
        label="From - To"
        [ngModel]="fromLocation() + ' - ' + toLocation()"
        (ngModelChange)="fromLocation.set($event)"
        name="fromTo"
      >
        <button type="button" class="flex items-center justify-center w-8 h-8 mr-1.5 border-0 rounded-full bg-transparent text-[#112211] text-xl cursor-pointer" aria-label="Swap locations" title="Swap locations">
          ⇅
        </button>
      </app-floating-field>

      <app-floating-field
        label="Trip"
        type="select"
        [options]="['Return', 'One Way', 'Multi-City']"
        [ngModel]="tripType()"
        (ngModelChange)="tripType.set($event)"
        name="tripType"
      />

      <app-floating-field
        label="Depart- Return"
        [ngModel]="departReturn()"
        (ngModelChange)="departReturn.set($event)"
        name="departReturn"
      />

      <app-floating-field
        label="Passenger - Class"
        [ngModel]="passengerClass()"
        (ngModelChange)="passengerClass.set($event)"
        name="passengerClass"
      />

      <button type="button" class="inline-flex items-center justify-center w-[52px] h-[52px] border-0 rounded-[10px] bg-mint text-[#112211] cursor-pointer shadow-[0_8px_18px_rgba(141,211,187,0.3)]" aria-label="Search flights">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="w-[22px] h-[22px] fill-current">
          <path d="M10.5 3a7.5 7.5 0 015.96 12.12l4.72 4.72 1.41-1.41-4.72-4.72A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z" />
        </svg>
      </button>
    </form>
  </section>

  <section class="relative grid grid-cols-[300px_minmax(0,1fr)] gap-8 items-start max-lg:grid-cols-1">
    <div>
      <app-flightlisting-filter-sidebar />
    </div>

    <div class="min-w-0">
      <app-flightlisting-results-toolbar
        [resultCount]="flights.length"
        [totalPlaces]="257"
        [selectedSort]="selectedSort"
        secondarySort="Recommended"
        [sortOptions]="sortOptions"
        (sortChange)="onSortChange($event)"
      />

      <div class="grid gap-[1.2rem]">
        @for (flight of flights; track flight.flightCode) {
          <app-flightlisting-flight-card
            [airline]="flight.airline"
            [flightCode]="flight.flightCode"
            [departureTime]="flight.departureTime"
            [arrivalTime]="flight.arrivalTime"
            [departureLabel]="flight.departureLabel"
            [arrivalLabel]="flight.arrivalLabel"
            [duration]="flight.duration"
            [aircraft]="flight.aircraft"
            [price]="flight.price"
            [rating]="flight.rating"
            [badge]="flight.badge"
            [imageUrl]="flight.imageUrl"
            [isFeatured]="flight.isFeatured"
          />
        }
      </div>

      <app-flightlisting-show-more />
    </div>
  </section>

  <app-destinations-section [destinations]="destinations" />
</main>
