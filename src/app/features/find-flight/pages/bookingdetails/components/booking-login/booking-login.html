<section class="rounded-xl bg-white p-4 shadow-[0_8px_22px_rgba(17,34,17,0.06)] sm:p-5" aria-labelledby="login-title">
  <h2 id="login-title" class="font-display text-lg font-extrabold text-[#112211]">Login or Sign up to book</h2>
  <form class="mt-3" (submit)="$event.preventDefault()">
    <label for="phone-number" class="sr-only">Phone Number</label>
    <input id="phone-number" type="tel" placeholder="Phone Number" [ngModel]="phoneNumber()" (ngModelChange)="phoneNumber.set($event)" name="phoneNumber" class="h-10 w-full rounded border border-[#8f8f98] bg-white px-3 text-xs text-[#112211] placeholder:text-[#52635c]" />
    <p class="mt-3 text-[0.68rem] leading-5 text-[#52635c]">We'll call or text you to confirm your number. Standard message and data rates apply. <strong class="text-[#112211]">Privacy Policy</strong></p>
    <button type="submit" class="mt-4 h-9 w-full rounded bg-mint text-xs font-medium text-[#112211] hover:bg-mint-dark">Continue</button>
  </form>

  <div class="my-4 flex items-center gap-4 text-xs text-[#112211]" aria-hidden="true"><span class="h-px flex-1 bg-[#dfe5e2]"></span>Or<span class="h-px flex-1 bg-[#dfe5e2]"></span></div>
  <div class="grid grid-cols-3 gap-3">
    <button type="button" class="grid h-10 place-items-center rounded border border-mint" aria-label="Continue with Facebook">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" class="size-5" aria-hidden="true">
        <path d="M0 0h256v256H0z" fill="none" />

      </svg>
    </button>
    <button type="button" class="grid h-10 place-items-center rounded border border-mint" aria-label="Continue with Google">

      </svg>
    </button>
  </div>
  <button type="button" class="mt-3 flex h-10 w-full items-center justify-center gap-3 rounded border border-mint text-xs text-[#112211]" aria-label="Continue with email">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-4 fill-current" aria-hidden="true">

</section>
